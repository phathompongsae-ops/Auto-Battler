<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171b24">
  <title>Realmfront — Fantasy Settlement War</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><span class="crest">R</span><div><strong>REALMFRONT</strong><small>Fantasy Settlement War</small></div></div>
      <div id="resourceHud" class="resources"></div>
      <div class="timebox"><strong id="monthLabel">Year 1 · Month 1</strong><small id="seasonLabel">Season 1</small></div>
    </header>

    <main class="game-shell">
      <section class="world-panel">
        <canvas id="cityCanvas" width="960" height="620" aria-label="Human settlement"></canvas>
        <div class="city-overlay">
          <div><b id="cityName">Dawnkeep</b><span id="cityLevel">Town Hall Lv.1</span></div>
          <div class="war-clock"><span>Season War</span><b id="warCountdown">3 months</b></div>
        </div>
        <div id="toast" class="toast" aria-live="polite"></div>
      </section>

      <aside class="side-panel">
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="build">Build</button>
          <button class="tab" data-tab="army">Army</button>
          <button class="tab" data-tab="expedition">Expedition</button>
          <button class="tab" data-tab="territory">Territory</button>
        </div>
        <div id="panelContent" class="panel-content"></div>
      </aside>
    </main>

    <nav class="bottom-actions">
      <button id="saveBtn">Save</button>
      <button id="newBtn">New Game</button>
      <button id="helpBtn">Guide</button>
      <button id="warBtn" class="danger" disabled>Season War</button>
    </nav>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button id="closeModal" class="close" aria-label="Close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
