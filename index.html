<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171b24">
  <meta name="description" content="Realmfront — a compact fantasy settlement war simulation.">
  <title>Realmfront — Fantasy Settlement War</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="crest" aria-hidden="true"><i></i></span>
        <div><strong>REALMFRONT</strong><small>Settlement War Alpha</small></div>
      </div>
      <div id="resourceHud" class="resources" aria-label="Resources"></div>
      <div class="timebox">
        <strong id="monthLabel">Year 1 · Month 1</strong>
        <small id="seasonLabel">Season 1</small>
      </div>
    </header>

    <main class="game-shell">
      <section class="world-panel" aria-label="Dawnkeep settlement">
        <canvas id="cityCanvas" width="960" height="620"></canvas>
        <div class="vignette"></div>
        <div class="city-overlay">
          <div class="city-chip">
            <b id="cityName">Dawnkeep</b>
            <span id="cityLevel">Town Hall Lv.1</span>
          </div>
          <div class="war-clock">
            <span>Season War</span>
            <b id="warCountdown">3 months</b>
          </div>
        </div>
        <div id="warAlert" class="war-alert hidden" aria-live="assertive">
          <small>THE FRONTIER STIRS</small>
          <b>SEASON WAR READY</b>
          <span>Choose a rival and march before the next expedition.</span>
        </div>
        <div id="floatingLayer" class="floating-layer" aria-hidden="true"></div>
        <div id="toast" class="toast" aria-live="polite"></div>
      </section>

      <aside class="side-panel">
        <div class="tabs" role="tablist" aria-label="Game menus">
          <button class="tab active" data-tab="build">Build</button>
          <button class="tab" data-tab="army">Army</button>
          <button class="tab" data-tab="expedition">Expedition</button>
          <button class="tab" data-tab="territory">Territory</button>
        </div>
        <div id="panelContent" class="panel-content"></div>
      </aside>
    </main>

    <nav class="bottom-actions" aria-label="Campaign controls">
      <button id="saveBtn">Save</button>
      <button id="newBtn">New Game</button>
      <button id="helpBtn">Guide</button>
      <button id="soundBtn" aria-pressed="true">Sound On</button>
      <button id="warBtn" class="danger" disabled>Season War</button>
    </nav>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Game dialog">
    <div class="modal-card">
      <button id="closeModal" class="close" aria-label="Close dialog">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
