name: Deploy Realmfront GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run game logic tests
        run: npm test
      - name: Build static site
        run: |
          mkdir -p _site/src
          cp index.html styles.css app.js _site/
          cp src/fantasy-core.js _site/src/
      - name: Publish production root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site
          destination_dir: .
          keep_files: false
          commit_message: "Deploy Realmfront ${{ github.sha }}"
