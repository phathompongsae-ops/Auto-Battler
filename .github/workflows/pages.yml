name: Deploy Realmfront GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run game logic tests
        run: npm test
      - name: Build static site
        run: |
          mkdir -p _site/src
          cp index.html styles.css app.js _site/
          cp src/fantasy-core.js _site/src/
      - name: Visual smoke screenshots
        run: |
          python3 -m http.server 4173 -d _site >/tmp/realmfront-server.log 2>&1 &
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --screenshot=desktop.png http://127.0.0.1:4173/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=mobile.png http://127.0.0.1:4173/
          test -s desktop.png
          test -s mobile.png
      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: realmfront-visual-qa
          path: |
            desktop.png
            mobile.png
      - name: Publish production root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site
          destination_dir: .
          keep_files: false
          commit_message: "Deploy Realmfront ${{ github.sha }}"
