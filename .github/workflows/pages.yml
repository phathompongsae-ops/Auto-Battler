name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Visual smoke screenshots
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort >/tmp/preview-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 3
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          timeout 45s "$CHROME" --headless --no-first-run --disable-background-networking --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --timeout=3000 --window-size=1440,900 --screenshot=desktop.png "http://127.0.0.1:4173/" || test -s desktop.png
          timeout 45s "$CHROME" --headless --no-first-run --disable-background-networking --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --timeout=3000 --window-size=390,844 --screenshot=mobile.png "http://127.0.0.1:4173/" || test -s mobile.png
          test -s desktop.png
          test -s mobile.png
      - name: Upload visual QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          if-no-files-found: ignore
          path: |
            desktop.png
            mobile.png
            /tmp/preview-server.log
      - name: Publish production root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist
          destination_dir: .
          keep_files: false
          commit_message: "Deploy ${{ github.sha }}"
