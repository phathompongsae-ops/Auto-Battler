name: Deploy Realmfront GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate browser JavaScript syntax
        run: |
          node --check app.js
          node --check src/fantasy-core.js
      - name: Run game logic tests
        run: npm test
      - name: Build static site
        run: |
          mkdir -p _site/src _site/assets
          cp index.html styles.css app.js _site/
          cp src/fantasy-core.js _site/src/
          cp -R assets/. _site/assets/
      - name: Visual smoke screenshots
        run: |
          python3 -m http.server 4173 -d _site >/tmp/realmfront-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          timeout 45s "$CHROME" --headless --no-first-run --disable-background-networking --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --timeout=3000 --window-size=1440,900 --screenshot=desktop.png "http://127.0.0.1:4173/?qa=1" || test -s desktop.png
          timeout 45s "$CHROME" --headless --no-first-run --disable-background-networking --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --timeout=3000 --window-size=390,844 --screenshot=mobile.png "http://127.0.0.1:4173/?qa=1" || test -s mobile.png
          timeout 45s "$CHROME" --headless --no-first-run --disable-background-networking --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --timeout=3000 --window-size=1200,800 --screenshot=battle-desktop.png "http://127.0.0.1:4173/?qa=battle" || test -s battle-desktop.png
          timeout 45s "$CHROME" --headless --no-first-run --disable-background-networking --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --timeout=3000 --window-size=390,844 --screenshot=battle-mobile.png "http://127.0.0.1:4173/?qa=battle-mobile" || test -s battle-mobile.png
          timeout 45s "$CHROME" --headless --no-first-run --disable-background-networking --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --timeout=3000 --window-size=1200,800 --screenshot=expedition-desktop.png "http://127.0.0.1:4173/?qa=expedition" || test -s expedition-desktop.png
          timeout 45s "$CHROME" --headless --no-first-run --disable-background-networking --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --timeout=3000 --window-size=390,844 --screenshot=expedition-mobile.png "http://127.0.0.1:4173/?qa=expedition" || test -s expedition-mobile.png
          timeout 45s "$CHROME" --headless --no-first-run --disable-background-networking --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --timeout=3000 --window-size=1200,800 --screenshot=war-desktop.png "http://127.0.0.1:4173/?qa=war" || test -s war-desktop.png
          timeout 45s "$CHROME" --headless --no-first-run --disable-background-networking --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --timeout=3000 --window-size=390,844 --screenshot=war-mobile.png "http://127.0.0.1:4173/?qa=war" || test -s war-mobile.png
          timeout 45s "$CHROME" --headless --no-first-run --disable-background-networking --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --timeout=3000 --window-size=390,844 --screenshot=army-mobile.png "http://127.0.0.1:4173/?qa=army" || test -s army-mobile.png
          test -s desktop.png
          test -s mobile.png
          test -s battle-desktop.png
          test -s battle-mobile.png
          test -s expedition-desktop.png
          test -s expedition-mobile.png
          test -s war-desktop.png
          test -s war-mobile.png
          test -s army-mobile.png
          kill $SERVER_PID 2>/dev/null || true
          trap - EXIT
      - name: Upload visual QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realmfront-visual-qa
          if-no-files-found: ignore
          path: |
            desktop.png
            mobile.png
            battle-desktop.png
            battle-mobile.png
            expedition-desktop.png
            expedition-mobile.png
            war-desktop.png
            war-mobile.png
            army-mobile.png
            /tmp/realmfront-server.log
      - name: Publish production root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site
          destination_dir: .
          keep_files: false
          commit_message: "Deploy Realmfront ${{ github.sha }}"
